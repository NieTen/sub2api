name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的四段版本标签（例如 v0.2.4.1）'
        required: true
        type: string
      simple_release:
        description: '简化发布：仅构建 x86_64 GHCR 镜像'
        required: false
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  SIMPLE_RELEASE: ${{ github.event.inputs.simple_release == 'true' || vars.SIMPLE_RELEASE == 'true' }}

permissions:
  contents: write
  packages: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      display_version: ${{ steps.version.outputs.display_version }}
      goreleaser_tag: ${{ steps.version.outputs.goreleaser_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate four-part version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "版本标签必须使用 v母版本.子版本 格式，例如 v0.2.4.1" >&2
            exit 1
          fi

          display_version="${RELEASE_TAG#v}"
          version_file="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [[ "$version_file" != "$display_version" ]]; then
            echo "VERSION 文件为 $version_file，但发布标签为 $display_version" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch custom <<< "$display_version"
          previous_tag="$(
            git tag --list 'v*.*.*.*' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              grep -vxF "$RELEASE_TAG" |
              sort -V |
              tail -n 1 || true
          )"

          if [[ -n "$previous_tag" ]]; then
            IFS='.' read -r previous_major previous_minor previous_patch previous_custom <<< "${previous_tag#v}"
            if (( major == previous_major && minor == previous_minor && patch == previous_patch )); then
              expected_custom=$((previous_custom + 1))
              if (( custom != expected_custom )); then
                echo "同一母版本的子版本必须连续递增：应为 v${major}.${minor}.${patch}.${expected_custom}" >&2
                exit 1
              fi
            else
              mother_is_newer=false
              if (( major > previous_major )); then
                mother_is_newer=true
              elif (( major == previous_major && minor > previous_minor )); then
                mother_is_newer=true
              elif (( major == previous_major && minor == previous_minor && patch > previous_patch )); then
                mother_is_newer=true
              fi

              if [[ "$mother_is_newer" != "true" ]]; then
                echo "母版本必须高于上一版本 ${previous_tag}" >&2
                exit 1
              fi
              if (( custom != 1 )); then
                echo "合并新的源仓库母版本后，首个定制版本必须从子版本 1 开始" >&2
                exit 1
              fi
            fi
          elif (( custom != 1 )); then
            echo "首个四段版本必须从子版本 1 开始" >&2
            exit 1
          fi

          # GoReleaser 只接受 SemVer；该影子标签只用于内部解析，不作为发布版本。
          goreleaser_tag="v${major}.${minor}.$((patch + 1))-0.${custom}"
          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"
          echo "goreleaser_tag=$goreleaser_tag" >> "$GITHUB_OUTPUT"
          echo "已验证发布版本 $RELEASE_TAG（GoReleaser 内部标签：$goreleaser_tag）"

  build-frontend:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [validate-version, build-frontend]
    runs-on: ubuntu-latest
    env:
      DISPLAY_VERSION: ${{ needs.validate-version.outputs.display_version }}
      GORELEASER_CURRENT_TAG: ${{ needs.validate-version.outputs.goreleaser_tag }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        run: go version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner for GHCR
        id: lowercase
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Create local GoReleaser tag
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${GORELEASER_CURRENT_TAG}"; then
            git tag -d "$GORELEASER_CURRENT_TAG"
          fi
          git tag -a "$GORELEASER_CURRENT_TAG" "$RELEASE_TAG^{commit}" \
            -m "仅供构建 ${RELEASE_TAG} 使用的内部标签"

      - name: Run full GoReleaser
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      - name: Run simple GoReleaser
        if: ${{ env.SIMPLE_RELEASE == 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --config=.goreleaser.simple.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip

      - name: Prepare release notes
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git for-each-ref --format='%(contents:body)' "refs/tags/${RELEASE_TAG}" > tag-message.txt
          ghcr_image="ghcr.io/${REPOSITORY,,}"

          {
            echo "> AI API 网关平台 - 订阅配额分发管理"
            echo
            cat tag-message.txt
            echo
            echo "---"
            echo
            echo "## 安装"
            echo
            echo '```bash'
            if [[ -n "$DOCKERHUB_USERNAME" ]]; then
              echo "docker pull ${DOCKERHUB_USERNAME}/sub2api:${DISPLAY_VERSION}"
            fi
            echo "docker pull ${ghcr_image}:${DISPLAY_VERSION}"
            echo '```'
            echo
            echo "也可以在本页面下载与操作系统对应的压缩包。"
          } > release-notes.md

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip)
          if [[ -f dist/checksums.txt ]]; then
            assets+=(dist/checksums.txt)
          fi
          if [[ "$SIMPLE_RELEASE" != "true" && ${#assets[@]} -eq 0 ]]; then
            echo "完整发布未生成任何可上传制品" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Sub2API ${DISPLAY_VERSION}" \
              --notes-file release-notes.md
            if (( ${#assets[@]} > 0 )); then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Sub2API ${DISPLAY_VERSION}" \
              --notes-file release-notes.md
          fi

      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: 'Sub2API - AI API Gateway Platform'
          readme-filepath: ./deploy/DOCKER.md

      - name: Send Telegram notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "未配置 Telegram 发布通知，跳过"
            exit 0
          fi

          ghcr_image="ghcr.io/${REPOSITORY,,}"
          tag_message="$(cat tag-message.txt)"
          if (( ${#tag_message} > 3000 )); then
            tag_message="${tag_message:0:3000}..."
          fi

          message="🚀 Sub2API 新版本发布：${DISPLAY_VERSION}"
          if [[ -n "$tag_message" ]]; then
            message+=$'\n\n'
            message+="$tag_message"
          fi
          message+=$'\n\nDocker：\n'
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            message+="docker pull ${DOCKERHUB_USERNAME}/sub2api:${DISPLAY_VERSION}"
            message+=$'\n'
          fi
          message+="docker pull ${ghcr_image}:${DISPLAY_VERSION}"
          message+=$'\n\n'
          message+="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"

          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$message" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' |
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              --data-binary @-
