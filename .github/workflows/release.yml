name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的四段版本标签（例如 v0.2.8.1）；预演时可填写分支'
        required: true
        type: string
      simple_release:
        description: '简化发布：仅构建 x86_64 GHCR 镜像'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '仅构建并验证全部所选产物，不发布'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SIMPLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.simple_release == true || github.event_name != 'workflow_dispatch' && vars.SIMPLE_RELEASE == 'true' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      owner_lower: ${{ steps.plan.outputs.owner_lower }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      date: ${{ steps.plan.outputs.date }}
      matrix: ${{ steps.plan.outputs.matrix }}
      simple: ${{ steps.plan.outputs.simple }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      goreleaser_tag: ${{ steps.version.outputs.goreleaser_tag }}
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Preserve tooling for releases of older tags
        run: cp -R .github/release-tools "$RUNNER_TEMP/release-tools"
      - name: Checkout selected application source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate four-part version
        id: version
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$REQUESTED_REF"
          if [[ "$DRY_RUN" == 'true' ]]; then
            RELEASE_TAG="v$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "版本标签必须使用 v母版本.子版本 格式，例如 v0.2.8.1" >&2
            exit 1
          fi

          display_version="${RELEASE_TAG#v}"
          version_file="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [[ "$version_file" != "$display_version" ]]; then
            echo "VERSION 文件为 $version_file，但发布标签为 $display_version" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch custom <<< "$display_version"
          previous_tag="$(
            git tag --list 'v*.*.*.*' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              grep -vxF "$RELEASE_TAG" |
              sort -V |
              tail -n 1 || true
          )"

          if [[ -n "$previous_tag" ]]; then
            IFS='.' read -r previous_major previous_minor previous_patch previous_custom <<< "${previous_tag#v}"
            if (( major == previous_major && minor == previous_minor && patch == previous_patch )); then
              expected_custom=$((previous_custom + 1))
              if (( custom != expected_custom )); then
                echo "同一母版本的子版本必须连续递增：应为 v${major}.${minor}.${patch}.${expected_custom}" >&2
                exit 1
              fi
            else
              mother_is_newer=false
              if (( major > previous_major )); then
                mother_is_newer=true
              elif (( major == previous_major && minor > previous_minor )); then
                mother_is_newer=true
              elif (( major == previous_major && minor == previous_minor && patch > previous_patch )); then
                mother_is_newer=true
              fi

              if [[ "$mother_is_newer" != "true" ]]; then
                echo "母版本必须高于上一版本 ${previous_tag}" >&2
                exit 1
              fi
              if (( custom != 1 )); then
                echo "合并新的源仓库母版本后，首个定制版本必须从子版本 1 开始" >&2
                exit 1
              fi
            fi
          elif (( custom != 1 )); then
            echo "首个四段版本必须从子版本 1 开始" >&2
            exit 1
          fi

          # GoReleaser 只接受 SemVer；该影子标签只用于内部解析，不作为发布版本。
          goreleaser_tag="v${major}.${minor}.$((patch + 1))-0.${custom}"
          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"
          echo "goreleaser_tag=$goreleaser_tag" >> "$GITHUB_OUTPUT"
          echo "已验证发布版本 $RELEASE_TAG（GoReleaser 内部标签：$goreleaser_tag）"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Resolve one source commit and target matrix
        id: plan
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          args=(--ref "$REQUESTED_REF")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" plan "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  build-binaries:
    needs: [prepare, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DISPLAY_VERSION: ${{ needs.prepare.outputs.version }}
      GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.goreleaser_tag }}
      RELEASE_DATE: ${{ needs.prepare.outputs.date }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: 创建本地 GoReleaser 影子标签
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/${GORELEASER_CURRENT_TAG}"; then
            git tag -d "$GORELEASER_CURRENT_TAG"
          fi
          git tag -a "$GORELEASER_CURRENT_TAG" HEAD \
            -m "仅供构建 ${DISPLAY_VERSION} 使用的内部标签"
      - uses: actions/download-artifact@v8
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        run: go version | grep -q 'go1.27.0'
      - name: Restore target-specific Go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ needs.prepare.outputs.sha }}
          restore-keys: |
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Select one GoReleaser target
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: python "$RUNNER_TEMP/release-tools/release_matrix.py" config build --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --output "$RUNNER_TEMP/goreleaser.matrix.yaml"
      - name: Build and archive without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=validate,publish,docker,announce --config=${{ runner.temp }}/goreleaser.matrix.yaml
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ needs.prepare.outputs.owner_lower }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip
          TAG_MESSAGE: ''
      - name: Verify and collect the target archive
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python "$RUNNER_TEMP/release-tools/release_matrix.py" collect --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --output matrix-output
      - uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-output/
          if-no-files-found: error
          retention-days: 1
      - name: Save updated target cache
        if: ${{ steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  release:
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      SIMPLE_RELEASE: ${{ needs.prepare.outputs.simple }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DISPLAY_VERSION: ${{ needs.prepare.outputs.version }}
      GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.goreleaser_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: 创建本地 GoReleaser 影子标签
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/${GORELEASER_CURRENT_TAG}"; then
            git tag -d "$GORELEASER_CURRENT_TAG"
          fi
          git tag -a "$GORELEASER_CURRENT_TAG" HEAD \
            -m "仅供构建 ${DISPLAY_VERSION} 使用的内部标签"
      - uses: actions/download-artifact@v8
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/download-artifact@v8
        with:
          pattern: release-binary-*
          path: release-input
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Verify complete matrix and prepare Docker contexts
        run: |
          args=(--version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --input release-input --output .release-context)
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" contexts "${args[@]}"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: ${{ env.DRY_RUN != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images and publish manifests
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}
        run: bash "$RUNNER_TEMP/release-tools/release-images.sh"
      - name: Get annotated tag notes
        id: tag_message
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$RELEASE_TAG")
          DELIMITER="TAG_MESSAGE_$(openssl rand -hex 16)"
          {
            echo "message<<$DELIMITER"
            echo "$TAG_MESSAGE"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare publication-only GoReleaser config
        run: |
          args=(publish --output "$RUNNER_TEMP/goreleaser.publisher.yaml")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" config "${args[@]}"
      - name: 汇总已构建产物与校验文件
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate,before,docker ${{ env.DRY_RUN == 'true' && '--snapshot --skip=publish,announce' || '' }} --config=${{ runner.temp }}/goreleaser.publisher.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REPO_OWNER_LOWER: ${{ needs.prepare.outputs.owner_lower }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}
      - name: 生成真实版本发布说明
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          git for-each-ref --format='%(contents:body)' "refs/tags/${RELEASE_TAG}" > tag-message.txt
          ghcr_image="ghcr.io/${REPOSITORY,,}"

          {
            echo "> AI API 网关平台 - 订阅配额分发管理"
            echo
            cat tag-message.txt
            echo
            echo "---"
            echo
            echo "## 安装"
            echo
            echo '```bash'
            if [[ "$SIMPLE_RELEASE" != "true" && -n "$DOCKERHUB_USERNAME" ]]; then
              echo "docker pull ${DOCKERHUB_USERNAME}/sub2api:${DISPLAY_VERSION}"
            fi
            echo "docker pull ${ghcr_image}:${DISPLAY_VERSION}"
            echo '```'
            echo
            if [[ "$SIMPLE_RELEASE" != "true" ]]; then
              echo "也可以在本页面下载与操作系统对应的压缩包。"
            fi
          } > release-notes.md

      - name: 发布真实四段版本与已验证产物
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          if [[ "$SIMPLE_RELEASE" != "true" ]]; then
            assets=(release-input/*.tar.gz release-input/*.zip)
            if [[ ! -s dist/checksums.txt ]]; then
              echo "完整发布缺少校验文件" >&2
              exit 1
            fi
            assets+=(dist/checksums.txt)
          fi
          if [[ "$SIMPLE_RELEASE" != "true" && ${#assets[@]} -eq 0 ]]; then
            echo "完整发布未生成任何可上传制品" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Sub2API ${DISPLAY_VERSION}" \
              --notes-file release-notes.md
            if (( ${#assets[@]} > 0 )); then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Sub2API ${DISPLAY_VERSION}" \
              --notes-file release-notes.md
          fi

      - name: Upload dry-run checksums and metadata
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-report
          path: |
            dist/checksums.txt
            dist/artifacts.json
            dist/metadata.json
          if-no-files-found: error
          retention-days: 3

      # 更新 DockerHub 说明
      - name: Update DockerHub description
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      - name: Send Telegram notification
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "未配置 Telegram 发布通知，跳过"
            exit 0
          fi

          ghcr_image="ghcr.io/${REPOSITORY,,}"
          tag_message="$(cat tag-message.txt)"
          if (( ${#tag_message} > 3000 )); then
            tag_message="${tag_message:0:3000}..."
          fi

          message="🚀 Sub2API 新版本发布：${DISPLAY_VERSION}"
          if [[ -n "$tag_message" ]]; then
            message+=$'\n\n'
            message+="$tag_message"
          fi
          message+=$'\n\nDocker：\n'
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            message+="docker pull ${DOCKERHUB_USERNAME}/sub2api:${DISPLAY_VERSION}"
            message+=$'\n'
          fi
          message+="docker pull ${ghcr_image}:${DISPLAY_VERSION}"
          message+=$'\n\n'
          message+="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"

          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$message" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' |
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              --data-binary @-
